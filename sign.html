<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign your service agreement · Prairie Lint Patrol</title>
<link rel="icon" href="badge.png">
<style>
  :root { --navy: #102d37; --ink: #0c2238; --muted: #5b6b78; --line: #dde4e8; --accent: #ffa94d; --rust: #a33b13; --bg: #f4f1ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
  header img { width: 44px; height: 44px; border-radius: 10px; background: #fff; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { font-size: 13px; opacity: .8; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 120px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .lead { font-size: 17px; }
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 10px; margin-bottom: 14px; font-size: 15px; }
  .doc h2 { font-size: 19px; margin: 0 0 6px; }
  .doc h4 { margin: 14px 0 2px; font-size: 14px; color: var(--rust); letter-spacing: .02em; }
  .doc p { margin: 3px 0; }
  .doc p.indent { color: var(--muted); padding-left: 14px; font-size: 14px; }
  .rtc { font-weight: 800; font-size: 15px; border: 2px solid var(--navy); border-radius: 10px; padding: 10px 12px; margin: 12px 0 !important; background: #fffdf6; }
  .notice { border: 2px dashed var(--rust); }
  .notice h4 { font-size: 17px; color: var(--navy); margin-top: 0; }
  .notice p { font-weight: 700; font-size: 13.5px; }
  .notice .copy { font-weight: 400; color: var(--muted); font-size: 13px; }
  label.tick { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  label.tick:first-of-type { border-top: 0; }
  label.tick input { width: 24px; height: 24px; flex: none; margin-top: 1px; accent-color: var(--navy); }
  .fld { display: block; font-weight: 700; margin: 12px 0 4px; }
  input.text { width: 100%; font: inherit; font-size: 17px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fbfaf7; }
  .sigwrap { position: relative; margin-top: 12px; }
  canvas { width: 100%; height: 190px; border: 2px solid var(--line); border-radius: 12px; background: #fff; touch-action: none; display: block; }
  .sigline { position: absolute; left: 16px; right: 16px; bottom: 38px; border-bottom: 2px solid #c8d0d6; color: #9aa6af; font-size: 14px; pointer-events: none; }
  .sigline.signed { opacity: .35; }
  button { font: inherit; font-weight: 700; border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 12px 16px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); width: 100%; font-size: 18px; padding: 16px; }
  button:disabled { opacity: .6; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 760px; margin: 0 auto; }
  .err { color: #b3261e; font-weight: 700; margin-top: 8px; }
  .ok { font-size: 40px; color: #1b7a3c; text-align: center; }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .sigimg { max-width: 320px; width: 100%; border-bottom: 2px solid #c8d0d6; display: block; margin-top: 6px; }
  .print-only { display: none; }
  @media print {
    header, .bar, .no-print { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .doc, .card { border: 0; padding: 0; }
    .notice { break-before: page; border: 0; }
    .print-only { display: block; }
  }
</style>
</head>
<body>
<header>
  <img src="badge.png" alt="">
  <div><h1 id="bizName">Prairie Lint Patrol</h1><div class="sub">Service agreement</div></div>
</header>
<main id="main"><div class="card">Loading your agreement…</div></main>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<script src="config.js"></script>
<script src="jobs-core.js"></script>
<script src="agreement-template.js"></script>
<script src="sign.js"></script>
</body>
</html>
